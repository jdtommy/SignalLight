name: Build and sign release

# Push a v* tag to build, sign, and attach signallight.exe to a DRAFT release
# (review the notes, then publish). "Run workflow" builds and signs without
# releasing, and uploads the signed exe as a workflow artifact for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create/update the release
  id-token: write   # OIDC token for the passwordless Azure sign-in

jobs:
  build-sign:
    runs-on: windows-latest
    # Azure only trusts OIDC tokens issued for this environment
    # (subject repo:jdtommy/SignalLight:environment:release).
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      - name: Test
        working-directory: windows
        run: go test ./...

      - name: Build
        working-directory: windows
        run: go build -o signallight.exe .

      - name: Azure sign-in
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install sign tool
        run: dotnet tool install sign --version 0.9.1-beta.26431.1 --tool-path .tools

      - name: Sign
        run: |
          ./.tools/sign code artifact-signing windows/signallight.exe `
            --artifact-signing-endpoint https://eus.codesigning.azure.net/ `
            --artifact-signing-account jdtommy `
            --artifact-signing-certificate-profile SignalLight `
            --azure-credential-type azure-cli `
            --publisher-name "Jarad Duersch" `
            --description SignalLight `
            --description-url https://github.com/jdtommy/SignalLight `
            --verbosity warning

      - name: Verify signature
        run: |
          $sig = Get-AuthenticodeSignature windows/signallight.exe
          if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status) - $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Signature is not timestamped" }
          "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Upload signed exe (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signallight-signed
          path: windows/signallight.exe

      - name: Attach to draft release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag windows/signallight.exe --clobber
          } else {
            gh release create $tag windows/signallight.exe --draft --generate-notes --title "SignalLight $tag"
          }
