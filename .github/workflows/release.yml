name: Build and sign release

# Push a v* tag to build and sign signallight.exe plus the per-user installer
# (SignalLight-Setup-<version>.exe), compile the light's firmware
# (signallight-firmware-<version>.bin + .sha256), and attach them all to a DRAFT
# release (review the notes, then publish). "Run workflow" builds everything
# without releasing and uploads it as a workflow artifact for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create/update the release
  id-token: write   # OIDC token for the passwordless Azure sign-in

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Pinned to the versions used for local Arduino IDE builds, so CI produces the
    # same firmware.
    env:
      ESP32_CORE: arduino:esp32@2.0.18-arduino.5
      ARDUINO_BLE: ArduinoBLE@2.1.0
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ESP32_CORE }}-${{ env.ARDUINO_BLE }}

      - name: Install core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          arduino-cli lib install "$ARDUINO_BLE"

      - name: Compile firmware
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          arduino-cli compile --fqbn arduino:esp32:nano_nora --output-dir build \
            --build-property "compiler.cpp.extra_flags=-DSIGNALLIGHT_VERSION=\"${VERSION}\"" \
            arduino/SignalLight
          # The light reports this string over BLE; make sure it was really stamped in.
          grep -a -q -F "$VERSION" build/SignalLight.ino.bin || { echo "::error::version $VERSION not found in firmware"; exit 1; }
          mkdir -p dist
          # The app image (not the merged/bootloader images) is what an OTA update writes.
          cp build/SignalLight.ino.bin "dist/signallight-firmware-${VERSION}.bin"
          cd dist && sha256sum "signallight-firmware-${VERSION}.bin" > "signallight-firmware-${VERSION}.bin.sha256"
          cat "signallight-firmware-${VERSION}.bin.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/

  build-sign:
    needs: firmware
    runs-on: windows-latest
    # Azure only trusts OIDC tokens issued for this environment
    # (subject repo:jdtommy/SignalLight:environment:release).
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      - name: Test
        working-directory: windows
        run: go test ./...

      # windowsgui: no console window when it starts at sign-in; logs go to
      # %LOCALAPPDATA%\SignalLight\signallight.log instead.
      - name: Build
        working-directory: windows
        run: go build -ldflags "-H=windowsgui" -o signallight.exe .

      - name: Azure sign-in
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install sign tool
        run: dotnet tool install sign --version 0.9.1-beta.26431.1 --tool-path .tools

      - name: Sign
        run: |
          ./.tools/sign code artifact-signing windows/signallight.exe `
            --artifact-signing-endpoint https://eus.codesigning.azure.net/ `
            --artifact-signing-account jdtommy `
            --artifact-signing-certificate-profile SignalLight `
            --azure-credential-type azure-cli `
            --publisher-name "Jarad Duersch" `
            --description SignalLight `
            --description-url https://github.com/jdtommy/SignalLight `
            --verbosity warning

      - name: Verify signature
        run: |
          $sig = Get-AuthenticodeSignature windows/signallight.exe
          if ($sig.Status -ne 'Valid') { throw "Signature check failed: $($sig.Status) - $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Signature is not timestamped" }
          "Signed by: $($sig.SignerCertificate.Subject)"

      # Inno Setup signs both Setup and the uninstaller it installs, using the same
      # sign tool. In the /S value, $q is a quote and $f is the file being signed.
      - name: Build signed installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $version = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          $sign = '$q' + "$PWD\.tools\sign.exe" + '$q code artifact-signing $f --artifact-signing-endpoint https://eus.codesigning.azure.net/ --artifact-signing-account jdtommy --artifact-signing-certificate-profile SignalLight --azure-credential-type azure-cli --publisher-name $qJarad Duersch$q --description SignalLight --description-url https://github.com/jdtommy/SignalLight --verbosity warning'
          & $iscc "/DAppVersion=$version" /DSIGN "/Sazsign=$sign" installer/SignalLight.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Verify installer signature
        run: |
          $setup = Get-ChildItem installer/Output/SignalLight-Setup-*.exe
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne 'Valid') { throw "Installer signature check failed: $($sig.Status) - $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "Installer signature is not timestamped" }
          "$($setup.Name) signed by: $($sig.SignerCertificate.Subject)"

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware

      - name: Upload release files (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signallight-release-files
          path: |
            windows/signallight.exe
            installer/Output/SignalLight-Setup-*.exe
            firmware/*

      - name: Attach to draft release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @('windows/signallight.exe') +
            (Get-ChildItem installer/Output/SignalLight-Setup-*.exe).FullName +
            (Get-ChildItem firmware/*).FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --draft --generate-notes --title "SignalLight $tag"
          }
